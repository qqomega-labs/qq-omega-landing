<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | QQ Omega Labs</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'JetBrains Mono', monospace;
        background: linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 100%);
        color: #e0e0e0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }

      .container {
        text-align: center;
        max-width: 600px;
      }

      .error-code {
        font-size: clamp(4rem, 15vw, 8rem);
        font-weight: 700;
        background: linear-gradient(135deg, #FD015A 0%, #ff69b4 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 1rem;
        line-height: 1;
      }

      h1 {
        font-size: clamp(1.5rem, 4vw, 2.5rem);
        font-weight: 500;
        margin-bottom: 1rem;
        color: #ffffff;
      }

      p {
        font-size: clamp(0.875rem, 2vw, 1.125rem);
        font-weight: 300;
        line-height: 1.6;
        color: #a0a0a0;
        margin-bottom: 2rem;
      }

      .btn {
        display: inline-block;
        padding: 1rem 2rem;
        background: linear-gradient(135deg, #FD015A 0%, #ff69b4 100%);
        color: #ffffff;
        text-decoration: none;
        border-radius: 0.5rem;
        font-weight: 500;
        font-size: 1rem;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 4px 20px rgba(253, 1, 90, 0.3);
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 30px rgba(253, 1, 90, 0.5);
      }

      .btn:active {
        transform: translateY(0);
      }

      .logo {
        margin-bottom: 2rem;
        opacity: 0.8;
      }

      .logo svg {
        width: 80px;
        height: 80px;
        fill: #FD015A;
      }

      @media (max-width: 640px) {
        .container {
          padding: 1rem;
        }

        .btn {
          width: 100%;
          max-width: 280px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <text x="100" y="130" font-family="JetBrains Mono, monospace" font-size="120" font-weight="700" text-anchor="middle" fill="#FD015A">
            QQ
          </text>
        </svg>
      </div>

      <div class="error-code">404</div>

      <h1>Page Not Found</h1>

      <p>
        The page you're looking for doesn't exist or has been moved.
        <br />
        Let's get you back to analyzing crypto assets.
      </p>

      <a href="/" class="btn">Return to Home</a>
    </div>
  </body>
</html>
